<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .card {
            flex: 1;
            max-width: 320px;
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            animation: fadeIn 1s;
            transition: 0.3s;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            filter: grayscale(100%);
            transition: 0.3s;
        }
        .card:nth-child(2) img {
            filter: sepia(100%);
        }
        .card:hover {
            transform: translateY(-10px);
        }
        .card:hover img {
            filter: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @media (max-width: 800px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Profile Cards</h1>
    <section class="cards">
        <div class="card">
            <img src="https://picsum.photos/id/1005/400/300"
                 alt="Profile">
            <h2>Rahul</h2>
            <p>Web Developer</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1006/400/300"
                 alt="Profile">
            <h2>Aman</h2>
            <p>Designer</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1012/400/300"
                 alt="Profile">
            <h2>Riya</h2>
            <p>Student</p>
        </div>
    </section>
</body>
</html>
