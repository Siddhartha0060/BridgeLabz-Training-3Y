<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .comparison {
            display: flex;
            gap: 25px;
        }
        .box {
            flex: 1;
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }
        .box img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: 0.5s;
        }
        .after img {
            filter: brightness(60%) contrast(140%);
        }
        .after img:hover {
            filter: none;
        }
        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Before and After Filter</h1>
    <section class="comparison">
        <div class="box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdi9ZkWP6xXKLIJqfl7Z8jqMm6QLNDNe5XZWuyQqTLjQ&s=10"
                 alt="Before">
            <h2>Before</h2>
            <p>Original Image</p>
        </div>
        <div class="box after">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdi9ZkWP6xXKLIJqfl7Z8jqMm6QLNDNe5XZWuyQqTLjQ&s=10"
                 alt="After">
            <h2>After</h2>
            <p>Filtered Image</p>
        </div>
    </section>
</body>
</html>
