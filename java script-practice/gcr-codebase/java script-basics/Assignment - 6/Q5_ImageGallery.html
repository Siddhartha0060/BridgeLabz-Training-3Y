<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
    }
    #gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        max-width: 700px;
        margin: 20px auto;
    }
    #gallery img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        cursor: pointer;
    }
    #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
    }
    #modal img {
        max-width: 80%;
        max-height: 80%;
    }
    #modal.active {
        display: flex;
    }
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div id="gallery">
    <img src="https://picsum.photos/id/10/500/350" alt="Image 1">
    <img src="https://picsum.photos/id/20/500/350" alt="Image 2">
    <img src="https://picsum.photos/id/30/500/350" alt="Image 3">
    <img src="https://picsum.photos/id/40/500/350" alt="Image 4">
    <img src="https://picsum.photos/id/50/500/350" alt="Image 5">
    <img src="https://picsum.photos/id/60/500/350" alt="Image 6">
</div>
<div id="modal">
    <img id="modalImage" src="" alt="Large preview">
</div>
<script src="Q5_ImageGallery.js"></script>
</body>
</html>
