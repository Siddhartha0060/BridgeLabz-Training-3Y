<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
    }
    #mouseBox {
        width: 400px;
        height: 400px;
        border: 2px solid black;
        background-color: lightgray;
        margin: 20px auto;
        position: relative;
    }
    #coordinates {
        font-size: 18px;
    }
    .redDot {
        width: 12px;
        height: 12px;
        background-color: red;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
    }
</style>
</head>
<body>
<h2>Mouse Coordinates</h2>
<p id="coordinates">X: 0, Y: 0</p>
<div id="mouseBox"></div>
<p>Move your mouse inside the box.</p>
<p>Double-click to place a red dot.</p>
<script src="Q7_MouseCoordinates.js"></script>
</body>
</html>
