<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>
    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 30px auto;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 8px;
            box-sizing: border-box;
        }
        #counter {
            color: green;
        }
        #counter.warning {
            color: #c99700;
        }
        #counter.full {
            color: red;
        }
    </style>
</head>
<body>
    <h2>Live Character Counter</h2>
    <textarea id="message"
              maxlength="100"
              placeholder="Type up to 100 characters"></textarea>
    <p id="counter">100 characters remaining</p>
    <button id="resetButton">Reset</button>
    <script src="Q2_CharacterCounter.js"></script>
</body>
</html>
