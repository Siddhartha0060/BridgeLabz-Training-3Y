<!DOCTYPE html>
<html>
<head>
    <title>Product List Manager</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 30px auto;
        }
        input {
            padding: 8px;
        }
        button {
            padding: 7px;
            margin-left: 5px;
            cursor: pointer;
        }
        li {
            margin: 10px 0;
        }
        .product-name {
            display: inline-block;
            min-width: 180px;
        }
    </style>
</head>
<body>
    <h2>Dynamic Product List Manager</h2>
    <input type="text" id="productInput"
           placeholder="Enter product name">
    <button id="addButton">Add Product</button>
    <ul id="productList"></ul>
    <script src="Q1_ProductList.js"></script>
</body>
</html>
