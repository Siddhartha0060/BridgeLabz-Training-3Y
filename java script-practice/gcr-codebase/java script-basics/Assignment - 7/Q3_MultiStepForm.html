<!DOCTYPE html>
<html>
<head>
    <title>Multi-Step Form</title>
    <style>
        body {
            font-family: Arial;
            max-width: 450px;
            margin: 30px auto;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        input {
            display: block;
            width: 95%;
            padding: 9px;
            margin: 12px 0;
        }
        button {
            padding: 8px 15px;
            margin-right: 8px;
        }
        #error {
            color: red;
        }
    </style>
</head>
<body>
    <h2>
        Registration - Step
        <span id="stepNumber">1</span> of 3
    </h2>
    <form id="multiStepForm">
        <div class="step active">
            <label>Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name">
        </div>
        <div class="step">
            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email">
        </div>
        <div class="step">
            <label>Password</label>
            <input type="password" id="password"
                   placeholder="At least 6 characters">
        </div>
        <p id="error"></p>
        <button type="button" id="backButton">Back</button>
        <button type="button" id="nextButton">Next</button>
    </form>
    <div id="summary"></div>
    <script src="Q3_MultiStepForm.js"></script>
</body>
</html>
