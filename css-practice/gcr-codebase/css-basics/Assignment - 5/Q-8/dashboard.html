<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #11121d;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 30px;
        }
        .dashboard {
            display: flex;
            padding-top: 80px;
        }
        .sidebar {
            width: 20%;
            min-height: 100vh;
            background-color: #090917;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            color: white;
            font-size: 25px;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #555;
        }
        .content {
            width: 80%;
            padding: 30px;
            box-sizing: border-box;
        }
        .boxes {
            display: flex;
            gap: 20px;
        }
        .box {
            width: 50%;
            background-color: white;
            padding: 25px;
            margin: 10px;
            box-shadow: 3px 3px 10px gray;
            border-radius: 10px;
        }
        .box h2 {
            font-size: 25px;
        }
        .box p {
            font-size: 18px;
        }
        @media screen and (max-width: 600px) {
            .dashboard {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-height: auto;
            }
            .content {
                width: 100%;
            }
            .boxes {
                flex-direction: column;
            }
            .box {
                width: 100%;
                box-sizing: border-box;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Dashboard</h1>
    </header>
    <div class="dashboard">
        <div class="sidebar">
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Reports</a>
            <a href="#">Logout</a>
        </div>
        <div class="content">
            <h1>Dashboard Overview</h1>
            <div class="boxes">
                <div class="box">
                    <h2>Total Users</h2>
                    <p>There are 1,250 registered users.</p>
                </div>
                <div class="box">
                    <h2>Total Sales</h2>
                    <p>Total sales this month are ₹50,000.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
