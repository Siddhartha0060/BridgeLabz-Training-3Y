<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .margin {
            background-color: orange;
            padding: 30px;
        }
        .border {
            border: 15px solid red;
            background-color: yellow;
        }
        .padding {
            padding: 30px;
            background-color: lightgreen;
        }
        .content {
            width: 200px;
            height: 100px;
            background-color: rgb(0, 191, 255);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-sizing {
            width: 250px;
            height: 120px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: border-box;
            margin: 30px auto;
            background-color: rgb(82, 82, 82);
        }
    </style>
</head>
<body>
    <h1>CSS Box Model</h1>
    <div class="container">
        <div class="margin">
            <div class="border">
                <div class="padding">
                    <div class="content">
                        Content
                    </div>
                </div>
            </div>
        </div>
    </div>
    <h2>Box Model Layers</h2>
    <p>Orange = Margin</p>
    <p>Red = Border</p>
    <p>Green = Padding</p>
    <p>Blue = Content</p>
    <h2>Border Box</h2>
    <div class="box-sizing">
        box-sizing: border-box
    </div>
</body>
</html>
