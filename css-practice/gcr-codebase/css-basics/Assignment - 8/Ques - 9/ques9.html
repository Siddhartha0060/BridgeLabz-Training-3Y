<!DOCTYPE html>
<html>
<head>
    <title>Question 9 - Combined Effects</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background-color: #eeeeee;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: green;
            transform: scale(1.1);
            box-shadow: 0 5px 10px gray;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: 3px solid lightblue;
        }
    </style>
</head>

<body>

    <h1>Combined CSS Effects</h1>

    <div class="buttons">

        <button>Button One</button>

        <button>Button Two</button>

        <button>Button Three</button>

    </div>

</body>
</html>
