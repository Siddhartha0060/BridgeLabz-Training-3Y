<!DOCTYPE html>
<html>
<head>
    <title>Question 2 - Tooltip</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
            padding: 50px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .tooltip-box {
            position: relative;
            display: inline-block;
        }

        .button {
            padding: 15px 25px;
            background-color: aqua;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;

            transform: translateX(-50%);

            background-color: black;
            color: white;

            padding: 8px 12px;
            border-radius: 5px;

            opacity: 0;
            transition: opacity 0.3s ease-in-out;

            white-space: nowrap;
            margin-bottom: 8px;
        }

        .tooltip-box:hover .tooltip {
            opacity: 1;
        }
    </style>
</head>

<body>

    <h1>Tooltip Example</h1>

    <div class="container">

        <div class="tooltip-box">
            <div class="button">Home</div>
            <div class="tooltip">Go to Home</div>
        </div>

        <div class="tooltip-box">
            <div class="button">Profile</div>
            <div class="tooltip">Open Profile</div>
        </div>

        <div class="tooltip-box">
            <div class="button">Settings</div>
            <div class="tooltip">Open Settings</div>
        </div>
    </div>
</body>
</html>
