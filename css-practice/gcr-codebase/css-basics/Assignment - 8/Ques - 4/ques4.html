<!DOCTYPE html>
<html>
<head>
    <title>Question 4 - CSS Selectors</title>

    <style>
        /* Element selector */
        p {
            color: blue;
        }

        /* Class selector */
        .important {
            color: red;
            font-weight: bold;
        }

        /* ID selector */
        #main-heading {
            color: darkgreen;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid blue;
            padding: 8px;
        }

        /* Descendant selector */
        .box p {
            background-color: lightyellow;
        }

        /* Child selector */
        .list > li {
            color: purple;
        }

        /* Adjacent sibling selector */
        h2 + p {
            font-style: italic;
        }

        /* General sibling selector */
        h3 ~ p {
            color: brown;
        }

        body {
            font-family: Arial;
            padding: 30px;
        }

        header, footer {
            padding: 20px;
            background-color: lightgray;
            text-align: center;
        }

        main {
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1 id="main-heading">CSS Selectors</h1>
    </header>

    <main>

        <p>This is an element selector.</p>

        <p class="important">
            This is a class selector.
        </p>

        <input type="text" placeholder="Attribute selector">

        <div class="box">
            <p>This paragraph is inside the box.</p>
        </div>

        <ul class="list">
            <li>Item One</li>
            <li>Item Two</li>
            <li>Item Three</li>
        </ul>

        <h2>Heading Two</h2>
        <p>This is adjacent to h2.</p>

        <h3>Heading Three</h3>
        <p>Sibling paragraph one.</p>
        <p>Sibling paragraph two.</p>

    </main>

    <footer>
        <p>My CSS Assignment</p>
    </footer>

</body>
</html>
