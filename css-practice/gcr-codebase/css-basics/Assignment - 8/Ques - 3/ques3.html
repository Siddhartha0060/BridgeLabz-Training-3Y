<!DOCTYPE html>
<html>
<head>
    <title>Question 3 - Image Showcase</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eeeeee;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        figure {
            margin: 0;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
            text-align: center;
        }
        .image-box {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }
        img {
            width: 100%;
            display: block;
            transition: transform 0.3s;
        }
        figure:hover img {
            transform: scale(1.1);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);

            opacity: 0;
            transition: opacity 0.3s;
        }
        figure:hover .overlay {
            opacity: 1;
        }
        figcaption {
            padding: 10px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Image Showcase</h1>
    <div class="gallery">
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHj0r68jZH4eo3fYSF4w2kuacrnLWu69OP644HsnhNkw&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image One</figcaption>
        </figure>
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ62mZn-g_FDVhNAYwqwPoESQG3SPPdwb3tqGphpeBmbQ&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image Two</figcaption>
        </figure>
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-RMv5Tlo5NzpUFAQr9XmkPHlrC0dVu0tIo60ga4RhxA&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image Three</figcaption>
        </figure>
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSn_ojT_ZgTEvdX-vnfsiUtNdoGHUAi1chQfwlcnCaavQ&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image Four</figcaption>
        </figure>
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQ0Be5HrFX3M3l_zj4G-l1Ty4CltZS0o8f1u1dLhJLNw&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image Five</figcaption>
        </figure>
        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRizZB6UMXQhINg8rZr5PZvf6-bwfLCd_iJ49V2Lsf_Eg&s=10">
                <div class="overlay"></div>
            </div>
            <figcaption>Image Six</figcaption>
        </figure>
    </div>
</body>
</html>
