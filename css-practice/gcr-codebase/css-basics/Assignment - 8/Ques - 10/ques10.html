<!DOCTYPE html>
<html>
<head>
    <title>Question 10 - Mini UI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        header {
            background-color: darkblue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 400px;
            background-color: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input:focus {
            outline: 2px solid rgb(24, 24, 57);
        }

        button {
            padding: 12px 20px;
            background-color: rgb(24, 24, 57);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }

        footer {
            background-color: darkgray;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 500px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Mini Website</h1>
    </header>

    <main>

        <div class="card">

            <img src="https://picsum.photos/400/200" alt="Sample Image">

            <h2>Contact Us</h2>

            <p>Please fill the form below.</p>

            <form>

                <input type="text" placeholder="Enter your name">

                <input type="email" placeholder="Enter your email">

                <button type="submit">Submit</button>

            </form>

        </div>

    </main>

    <footer>
        <p>My CSS Assignment</p>
    </footer>

</body>
</html>
