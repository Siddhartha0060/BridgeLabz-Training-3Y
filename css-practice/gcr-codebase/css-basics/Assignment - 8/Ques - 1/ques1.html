<!DOCTYPE html>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 30px;
        }
        h1 {
            color: darkblue;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            background-color: blue;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        button:active {
            background-color: red;
        }
        input:focus {
            border: 3px solid blue;
            outline: none;
        }
        li:nth-child(2) {
            color: red;
            font-weight: bold;
        }
        a {
            color: blue;
        }
        a:hover {
            color: red;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Pseudo Classes Example</h1>
    <div class="container">
        <button>Hover Me</button>
        <input type="text" placeholder="Click here">
        <a href="#">Hover Link</a>
    </div>
    <h2>My List</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>
</body>
</html>
