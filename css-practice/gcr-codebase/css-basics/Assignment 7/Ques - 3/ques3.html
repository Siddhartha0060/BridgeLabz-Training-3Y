<!DOCTYPE html>
<html>
<head>
    <title>Gradient Background</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
        }
        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .linear {
            background: linear-gradient(
                to right,
                rgb(54, 196, 215),
                purple
            );
        }
        .radial {
            background: radial-gradient(
                circle,
                orange,
                red
            );
            background-attachment: fixed;
        }
        .content {
            font-size: 30px;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h2>Gradient Page</h2>
    </header>
    <section class="linear">
        <div class="content">
            <h1>Linear Gradient</h1>
            <p>Colors move from one direction to another.</p>
        </div>
    </section>
    <section class="radial">
        <div class="content">
            <h1>Radial Gradient</h1>
            <p>Colors spread from the center.</p>
        </div>
    </section>
    <footer>
        <p>© 2026 My Website</p>
    </footer>
</body>
</html>
