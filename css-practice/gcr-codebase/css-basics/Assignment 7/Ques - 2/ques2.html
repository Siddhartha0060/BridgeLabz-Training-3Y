<!DOCTYPE html>
<html>
<head>
    <title>Height and Width</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        h1 {
            text-align: center;
        }
        .container {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .box {
            padding: 20px;
            text-align: center;
        }
        .box1 {
            width: 150px;
            height: 150px;
            background-color: rgb(103, 194, 225);
        }
        .box2 {
            width: 30%;
            height: 30vh;
            background-color: rgb(18, 114, 18);
        }
        .box3 {
            width: 15em;
            height: 200px;
            background-color: rgb(255, 42, 42);
            min-height: 150px;
            max-width: 300px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>Height and Width Practice</h1>
    <div class="container">
        <div class="box box1">
            <h2>Box 1</h2>
            <p>150px × 150px</p>
        </div>
        <div class="box box2">
            <h2>Box 2</h2>
            <p>30% width</p>
            <p>30vh height</p>
        </div>
        <div class="box box3">
            <h2>Box 3</h2>
            <p>
                This box demonstrates em,
                min-height, max-width and overflow.
            </p>
        </div>
    </div>
</body>
</html>
