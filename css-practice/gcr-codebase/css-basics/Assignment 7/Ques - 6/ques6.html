<!DOCTYPE html>
<html>
<head>
    <title>CSS Transformations</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 50px;
        }
        .item {
            text-align: center;
        }
        .box {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
            transition: all 0.4s ease;
        }
        .rotate:hover {
            transform: rotate(20deg);
        }
        .scale:hover {
            transform: scale(1.3);
        }
        .translate:hover {
            transform: translateY(-30px);
        }
        .skew:hover {
            transform: skew(15deg);
        }
    </style>
</head>
<body>
    <h1>CSS Transformations</h1>
    <div class="container">
        <div class="item">
            <div class="box rotate">
                Rotate
            </div>
            <p>rotate()</p>
        </div>
        <div class="item">
            <div class="box scale">
                Scale
            </div>
            <p>scale()</p>
        </div>
        <div class="item">
            <div class="box translate">
                Translate
            </div>
            <p>translate()</p>
        </div>
        <div class="item">
            <div class="box skew">
                Skew
            </div>
            <p>skew()</p>
        </div>
    </div>
</body>
</html>
