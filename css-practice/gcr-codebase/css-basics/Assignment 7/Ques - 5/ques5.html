<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }
        input[type="text"] {
            border: 2px solid blue;
            padding: 10px;
        }
        a[href^="https"] {
            color: green;
        }
        button:hover {
            background-color: lightblue;
        }
        input:focus {
            background-color: lightyellow;
        }
        li:nth-child(2) {
            color: red;
        }
        h2::before {
            content: ">> ";
        }
        h2::after {
            content: " <<";
        }
        .parent > p {
            color: blue;
        }
        h3 + p {
            background-color: lightgreen;
        }
        h4 ~ p {
            color: purple;
        }
        .box p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Advanced CSS Selectors</h1>
    <h2>Attribute Selectors</h2>
    <input type="text" placeholder="Enter your name">
    <br><br>
    <a href="https://google.com">
        Secure Website
    </a>
    <h2>Pseudo Classes</h2>
    <button>Hover Me</button>
    <ul>
        <li>Item One</li>
        <li>Item Two</li>
        <li>Item Three</li>
    </ul>
    <h2>Combinators</h2>
    <div class="parent">
        <p>Child paragraph</p>
        <div>
            <p>Descendant paragraph</p>
        </div>
    </div>
    <h3>Heading</h3>
    <p>Adjacent sibling paragraph</p>
    <h4>Another Heading</h4>
    <p>General sibling one</p>
    <p>General sibling two</p>
</body>
</html>
