<!DOCTYPE html>
<html>
<head>
    <title>Focus Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }
        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus {
            outline: 3px solid blue;
            outline-offset: 3px;
        }
        textarea:focus {
            outline: 3px dashed green;
            outline-offset: 3px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: 2px solid black;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Contact Form</h1>
        <form>
            <label>Name</label>
            <input type="text"
                   placeholder="Enter your name">
            <label>Email</label>
            <input type="email"
                   placeholder="Enter your email">
            <label>Message</label>
            <textarea rows="5"
                      placeholder="Enter your message"></textarea>
            <button type="submit">
                Submit
            </button>
        </form>
    </div>
</body>
</html>
