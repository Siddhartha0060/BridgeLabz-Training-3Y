<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .box {
            width: 150px;
            background-color: white;
            margin: 10px;
            transition: 0.3s;
        }
        .solid {
            border: 5px solid black;
            padding: 20px;
        }
        .dashed {
            border: 5px dashed black;
            padding: 30px;
        }
        .double {
            border: 8px double black;
            padding: 15px;
        }
        .groove {
            border: 8px groove black;
            padding: 25px;
        }
        .rounded {
            border-radius: 20px;
        }
        .box:hover {
            border-color: rgb(255, 77, 0);
        }
    </style>
</head>
<body>
    <h1>Borders and Padding</h1>
    <div class="container">
        <div class="box solid rounded">
            <h2>Solid</h2>
            <p>Padding: 20px</p>
        </div>
        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Padding: 30px</p>
        </div>
        <div class="box double rounded">
            <h2>Double</h2>
            <p>Padding: 15px</p>
        </div>
        <div class="box groove">
            <h2>Groove</h2>
            <p>Padding: 25px</p>
        </div>
    </div>
</body>
</html>
