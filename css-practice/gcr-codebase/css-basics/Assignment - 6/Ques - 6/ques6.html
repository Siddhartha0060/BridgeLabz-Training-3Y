<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 20px;
            padding: 20px;
        }
        header {
            grid-area: header;
            background-color: lightblue;
            padding: 20px;
        }
        header nav a {
            margin-right: 20px;
            text-decoration: none;
            color: black;
        }
        aside {
            grid-area: sidebar;
            background-color: lightgray;
            padding: 20px;
        }
        main {
            grid-area: main;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        article {
            padding: 20px;
            background-color: lightgreen;
        }
        footer {
            grid-area: footer;
            background-color: lightblue;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "footer";
            }
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Blog</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <aside>
            <h2>Categories</h2>
            <p>Technology</p>
            <p>Programming</p>
            <p>Education</p>
            <p>Travel</p>
        </aside>
        <main>
            <article>
                <h2>Learning HTML</h2>
                <p>
                    HTML is used to create the structure
                    of a webpage.
                </p>
            </article>
            <article>
                <h2>Learning CSS</h2>
                <p>
                    CSS is used to design and style
                    webpages.
                </p>
            </article>
        </main>
        <footer>
            <p>Contact: siddharth001@gmail.com</p>
        </footer>
    </div>
</body>
</html>
