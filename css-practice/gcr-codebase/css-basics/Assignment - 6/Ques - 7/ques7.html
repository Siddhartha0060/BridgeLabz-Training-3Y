<!DOCTYPE html>
<html>
<head>
    <title>Loading Animation</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader {
            display: flex;
            gap: 10px;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
            animation: move 1s infinite;
        }
        .circle:nth-child(2) {
            animation-delay: 0.2s;
        }
        .circle:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes move {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
