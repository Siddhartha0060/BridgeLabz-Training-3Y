<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }
        .card-container {
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-container:hover .card {
            transform: rotateY(180deg);
        }
        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .front {
            background-color: lightblue;
        }
        .front img {
            width: 200px;
            height: 200px;
        }
        .back {
            background-color: lightgreen;
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="front">
                <h1>My Card</h1>
                <img src="https://picsum.photos/200"
                     alt="Image">
            </div>
            <div class="back">
                <h1>About Me</h1>
                <p>
                    I am Siddharth Singh.
                    I am a Computer Science student
                    and I am learning Web Development.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
