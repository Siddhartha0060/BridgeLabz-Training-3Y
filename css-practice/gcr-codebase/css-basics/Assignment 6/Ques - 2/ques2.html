<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .card {
            height: 150px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card:hover {
            transform: scale(1.05);
        }
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Product Gallery</h1>
    <div class="gallery">
        <div class="card">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>
        <div class="card">
            <h2>Mobile</h2>
            <p>₹21,000</p>
        </div>
        <div class="card">
            <h2>Headphones</h2>
            <p>₹2,000</p>
        </div>
        <div class="card">
            <h2>Keyboard</h2>
            <p>₹1,000</p>
        </div>
        <div class="card">
            <h2>Mouse</h2>
            <p>₹200</p>
        </div>
        <div class="card">
            <h2>Monitor</h2>
            <p>₹15,000</p>
        </div>
        <div class="card">
            <h2>Speaker</h2>
            <p>₹3,000</p>
        </div>
        <div class="card">
            <h2>Tablet</h2>
            <p>₹25,000</p>
        </div>
    </div>
</body>
</html>
