<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px auto;
            gap: 10px;
        }
        header {
            grid-column: 1 / 3;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        aside {
            background-color: lightgray;
            padding: 20px;
        }
        aside a {
            display: block;
            margin: 20px 0;
            text-decoration: none;
            color: black;
        }
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .box {
            background-color: lightgreen;
            padding: 40px;
            transition: 0.3s;
        }
        .box:hover {
            transform: scale(1.05);
            box-shadow: 5px 5px 15px gray;
        }
        .big-box {
            grid-column: span 2;
        }
        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            header {
                grid-column: 1;
            }
            main {
                grid-template-columns: 1fr;
            }
            .big-box {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>My Dashboard</h1>
        </header>
        <aside>
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>
        <main>
            <div class="box">
                <h2>Users</h2>
                <p>100 Users</p>
            </div>
            <div class="box">
                <h2>Orders</h2>
                <p>50 Orders</p>
            </div>
            <div class="box">
                <h2>Sales</h2>
                <p>₹50,000</p>
            </div>
            <div class="box">
                <h2>Visitors</h2>
                <p>500 Visitors</p>
            </div>
            <div class="box big-box">
                <h2>Total Report</h2>
                <p>This box covers two columns.</p>
            </div>
        </main>
    </div>
</body>
</html>
