<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entities</h1>
    <p>
        Less than: &lt;
        <br>
        Greater than: &gt;
        <br>
        Ampersand: &amp;
        <br>
        Double Quote: &quot;
        <br>
        Single Quote: &apos;
        <br>
        Copyright: &copy;
        <br>
        Trademark: &trade;
        <br>
        Registered: &reg;
    </p>
</body>
</html>
